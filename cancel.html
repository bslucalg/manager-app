<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagamento annullato – Manager App</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    body { background: linear-gradient(135deg, #0f1f3d, #162744); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .cancel-box {
      background: white;
      border-radius: 24px;
      padding: 52px 44px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }
    .cancel-icon { font-size: 4rem; margin-bottom: 16px; }
    .cancel-box h1 { font-size: 1.9rem; color: #0f1f3d; margin-bottom: 10px; }
    .cancel-box > p { color: #5a6a80; margin-bottom: 32px; line-height: 1.65; }
    .cancel-cta-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .cancel-note { margin-top: 24px; font-size: 0.85rem; color: #9aacbf; }
  </style>
</head>
<body>
<div class="cancel-box">
  <div class="cancel-icon">↩️</div>
  <h1 data-it="Pagamento annullato" data-en="Payment cancelled">Pagamento annullato</h1>
  <p data-it="Il pagamento non è stato completato. Nessun addebito è stato effettuato. Puoi riprovare quando vuoi." data-en="The payment was not completed. No charge has been made. You can try again whenever you're ready.">Il pagamento non è stato completato. Nessun addebito è stato effettuato. Puoi riprovare quando vuoi.</p>
  <div class="cancel-cta-group">
    <!-- SOSTITUISCI CON IL TUO STRIPE PAYMENT LINK -->
    <a href="https://buy.stripe.com/cNifZi5r22RW7rFfdGafS00" class="btn btn-primary btn-lg" data-it="🛒 Riprova – Acquista ora" data-en="🛒 Try again – Buy now">🛒 Riprova – Acquista ora</a>
    <a href="index.html" class="btn btn-outline btn-lg" data-it="← Torna alla home" data-en="← Back to home">← Torna alla home</a>
  </div>
  <p class="cancel-note" data-it="Per assistenza: controlla la sezione FAQ o contattaci." data-en="For support: check the FAQ section or contact us.">Per assistenza: controlla la sezione FAQ o contattaci.</p>
</div>

<script>
const savedLang = localStorage.getItem('lang') || 'it';
if (savedLang === 'en') {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.innerHTML = el.getAttribute('data-en');
  });
  document.documentElement.lang = 'en';
  document.title = 'Payment cancelled – Manager App';
}
</script>
</body>
</html>
